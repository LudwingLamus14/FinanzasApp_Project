spring.application.name=FinanzasApp_Backend
server.port=8080

# ---- Base de datos PostgreSQL ----
spring.datasource.url=jdbc:postgresql://localhost:5433/finanzas_db
spring.datasource.username=postgres

# ---- JPA / Hibernate ----
# validate: Hibernate SOLO comprueba que las tablas coincidan con las entidades.
# Las tablas se crean con database/database.sql (nunca con create o update).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.config.import=optional:classpath:secrets.properties